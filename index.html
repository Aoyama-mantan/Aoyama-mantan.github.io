<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aoyama-mantan · 文档库：文档索引">
  <title>Aoyama-mantan · 文档库</title>
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="sheet">

    <!-- 报头只是一行小标签：页面的 h1 保留语义，但不再用大字 -->
    <header class="masthead">
      <span class="mark" aria-hidden="true"></span>
      <h1 class="micro">Aoyama-mantan · 文档库</h1>
      <p class="micro masthead-tail">2026</p>
      <button type="button" class="theme-btn" aria-label="配色：自动（点击切换）" title="配色：自动（点击切换）">
        <svg class="i-auto" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>
        <svg class="i-light" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg>
        <svg class="i-dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
    </header>

    <!-- 数据行由 tools/build_site.py 维护：文档总数 -->
    <div class="dataline">
      <span class="micro">共 0 份文档</span>
      <span class="micro">按更新日期倒序</span>
    </div>

    <section aria-labelledby="docs">
      <div class="sec-head">
        <h2 id="docs">文档索引</h2>
      </div>
      <!-- 下面 <ol> 里的行由 tools/build_site.py 生成：标记区间只圈行，不含 <ol> 本身 -->
      <ol class="docs">
        <!-- index:start -->
        <li class="is-empty">
          <span class="d">—</span>
          <span class="t">暂无文档。<b>把 markdown 放进 docs/，这里就多一行</b>：日期在左，标题占主栏，类型靠右。</span>
          <span class="k">—</span>
        </li>
<!-- index:end -->
      </ol>
    </section>

    <footer>
      <span class="micro">© 2026 Aoyama-mantan</span>
      <span class="micro">Helvetica · 一个强调色 · 索引由 docs/ 生成</span>
    </footer>

  </div>
</body>
</html>
