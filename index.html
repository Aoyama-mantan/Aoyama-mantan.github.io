<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aoyama-mantan · 个人文档库">
  <title>Aoyama-mantan · 文档库</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="sheet">

    <header class="masthead">
      <span class="mark" aria-hidden="true"></span>
      <div class="masthead-body">
        <p class="micro">个人文档库 · 2026</p>
        <h1><span>Aoyama-</span><span class="quiet">mantan</span></h1>
      </div>
    </header>

    <div class="dataline">
      <span class="micro">计算机科学 · 南京航空航天大学</span>
      <span class="micro">笔记 / 论文 / 项目</span>
    </div>

    <section aria-labelledby="docs">
      <div class="sec-head">
        <span class="num">01</span>
        <h2 id="docs">文档索引</h2>
      </div>
      <ol class="docs">
        <li class="is-empty">
          <span class="d">—</span>
          <span class="t">暂无文档。<b>放进来一份，这里就多一行</b>：日期在左，标题占主栏，类型靠右。</span>
          <span class="k">—</span>
        </li>
      </ol>
    </section>

    <section aria-labelledby="about">
      <div class="sec-head">
        <span class="num">02</span>
        <h2 id="about">关于</h2>
      </div>
      <div class="prose">
        <p>本科生，方向为计算机视觉与多模态学习。这个站点只做一件事：把值得留下的文本按同一格式排在一条时间线上，不作展示性包装。</p>
        <p class="micro">联系：<a href="https://github.com/Aoyama-mantan" target="_blank" rel="noopener">GitHub</a></p>
      </div>
    </section>

    <footer>
      <span class="micro">© 2026 Aoyama-mantan</span>
      <span class="micro">Helvetica · 一个强调色 · 不用卡片</span>
    </footer>

  </div>
</body>
</html>
